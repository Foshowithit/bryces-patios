<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-labelledby="pbmT pbmD" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="pbmT">Cross-section of a patio, layer by layer</title>
  <desc id="pbmD">Pavers on top, then a bedding layer, then a compacted crushed stone base built in lifts, then undisturbed soil, with the surface sloped so water runs off.</desc>
  <rect width="640" height="720" fill="#FDFBF7"/>

  <defs>
    <marker id="mArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#55613E"/>
    </marker>
  </defs>
  <g stroke="#55613E" stroke-width="3" fill="none">
    <path d="M130 96 H340" marker-end="url(#mArrow)"/>
  </g>
  <text x="130" y="78" fill="#55613E" font-size="24" font-weight="600">Water runs off</text>

  <rect x="70" y="470" width="430" height="170" fill="#6B5B49"/>
  <g stroke="#7d6c58" stroke-width="1" opacity=".5"><path d="M70 510h430M70 550h430M70 590h430M70 630h430"/></g>

  <rect x="70" y="392" width="430" height="78" fill="#B9BCC0"/>
  <g fill="#9FA3A8">
    <circle cx="110" cy="430" r="11"/><circle cx="158" cy="418" r="9"/><circle cx="206" cy="434" r="12"/>
    <circle cx="254" cy="420" r="10"/><circle cx="302" cy="434" r="12"/><circle cx="350" cy="420" r="10"/>
    <circle cx="398" cy="432" r="11"/><circle cx="446" cy="420" r="9"/><circle cx="484" cy="432" r="10"/>
  </g>
  <rect x="70" y="440" width="430" height="30" fill="#AFB3B7"/>
  <path d="M70 440h430" stroke="#8f9398" stroke-width="3" stroke-dasharray="9 8"/>

  <rect x="70" y="376" width="430" height="16" fill="#E4D8BF"/>

  <g stroke="#9aa0a6" stroke-width="1.2">
    <rect x="70" y="330" width="62" height="46" fill="#C6C9CD"/>
    <rect x="132" y="334" width="62" height="46" fill="#BFC3C7"/>
    <rect x="194" y="338" width="62" height="46" fill="#C6C9CD"/>
    <rect x="256" y="342" width="62" height="46" fill="#BFC3C7"/>
    <rect x="318" y="346" width="62" height="46" fill="#C6C9CD"/>
    <rect x="380" y="350" width="60" height="46" fill="#BFC3C7"/>
    <rect x="440" y="354" width="60" height="46" fill="#C6C9CD"/>
  </g>

  <g stroke="#9aa0a6" stroke-width="1.5" fill="none">
    <path d="M450 350 L540 250 H560"/>
    <path d="M400 384 L540 300 H560"/>
    <path d="M420 430 L540 430 H560"/>
    <path d="M300 520 L540 548 H560"/>
  </g>
  <g font-size="22">
    <text x="632" y="248" text-anchor="end" font-weight="600" fill="#14171A">Pavers</text>
    <text x="632" y="298" text-anchor="end" fill="#8a7a5c">Bedding layer</text>
    <text x="632" y="424" text-anchor="end" font-weight="600" fill="#3B4147">Compacted stone base</text>
    <text x="632" y="452" text-anchor="end" font-size="19" fill="#5b6167">built in lifts</text>
    <text x="632" y="538" text-anchor="end" font-weight="600" fill="#EFE9DD">Undisturbed soil</text>
  </g>

  <g stroke="#14171A" stroke-width="1.6" opacity=".65">
    <path d="M46 330 V640"/><path d="M38 330 h16M38 640 h16"/>
  </g>
  <text x="26" y="485" fill="#14171A" font-size="17" font-weight="600" transform="rotate(-90 26 485)" text-anchor="middle">full dig depth</text>
</svg>
